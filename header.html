<!-- JavaScript for Mobile Menu, Dropdown, & Live Search Modal -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');
        const menuIcon = document.getElementById('menuIcon');

        if (menuToggle && navMenu && menuIcon) {
            menuToggle.addEventListener('click', function(e) {
                e.stopPropagation();
                navMenu.classList.toggle('active');

                if (navMenu.classList.contains('active')) {
                    menuIcon.classList.remove('fa-bars');
                    menuIcon.classList.add('fa-xmark');
                } else {
                    menuIcon.classList.remove('fa-xmark');
                    menuIcon.classList.add('fa-bars');
                }
            });

            const dropdowns = document.querySelectorAll('.apple-nav .dropdown');
            dropdowns.forEach(dropdown => {
                const dropbtn = dropdown.querySelector('.dropbtn');
                if (dropbtn) {
                    dropbtn.addEventListener('click', function(e) {
                        if (window.innerWidth <= 992) {
                            e.preventDefault();
                            e.stopPropagation();
                            dropdown.classList.toggle('open');
                        }
                    });
                }
            });
        }

        // Live Search Modal functionality (connected with allProducts from store.js)
        const liveSearchInput = document.getElementById('liveSearchInput');
        const searchResultsBox = document.getElementById('searchResultsBox');
        const openSearchModal = document.getElementById('openSearchModal');
        const searchModalOverlay = document.getElementById('searchModalOverlay');
        const searchCloseModal = document.getElementById('searchCloseModal');

        if (openSearchModal && searchModalOverlay) {
            openSearchModal.addEventListener('click', (e) => {
                e.preventDefault();
                searchModalOverlay.style.display = 'flex';
                if (liveSearchInput) liveSearchInput.focus();
            });
        }

        if (searchCloseModal && searchModalOverlay) {
            searchCloseModal.addEventListener('click', () => {
                searchModalOverlay.style.display = 'none';
            });
        }

        if (searchModalOverlay) {
            searchModalOverlay.addEventListener('click', (e) => {
                if (e.target === searchModalOverlay) {
                    searchModalOverlay.style.display = 'none';
                }
            });
        }

        if (liveSearchInput && searchResultsBox) {
            liveSearchInput.addEventListener('input', (e) => {
                const keyword = e.target.value.toLowerCase().trim();
                
                if (keyword === '') {
                    searchResultsBox.innerHTML = '<div class="search-no-result">Search products...</div>';
                    return;
                }

                // Check if allProducts exists globally from store.js
                const productsList = typeof allProducts !== 'undefined' ? allProducts : [];

                const filtered = productsList.filter(p => 
                    p.name.toLowerCase().includes(keyword) || 
                    (p.brand && p.brand.toLowerCase().includes(keyword)) ||
                    (p.machine_type && p.machine_type.toLowerCase().includes(keyword)) ||
                    (p.category && p.category.toLowerCase().includes(keyword))
                );

                if (filtered.length === 0) {
                    searchResultsBox.innerHTML = '<div class="search-no-result">រកមិនឃើញផលិតផលដែលអ្នកកំពុងស្វែងរកឡើយ</div>';
                    return;
                }

                let resultsHTML = '';
                filtered.forEach(product => {
                    const imgSrc = (product.images && product.images.length > 0) ? product.images[0] : 'images/default.png';
                    
                    resultsHTML += `
                        <div class="search-result-item" onclick="viewDetail('${product.id}')" style="display: flex; align-items: center; gap: 15px; padding: 12px 15px; border-bottom: 1px solid #f1f5f9; cursor: pointer; transition: background 0.2s;">
                            <img src="${imgSrc}" alt="${product.name}" style="width: 45px; height: 45px; object-fit: contain; border-radius: 6px; background: #f8fafc; border: 1px solid #e2e8f0; flex-shrink: 0;" onerror="this.src='https://via.placeholder.com/50?text=Printer'">
                            <div style="flex-grow: 1;">
                                <div style="font-size: 14px; font-weight: 600; color: #1e293b; line-height: 1.4;">${product.name}</div>
                                <div style="font-size: 12px; color: #0071e3; font-weight: 500; margin-top: 2px;">${product.price || 'Firmware only'}</div>
                            </div>
                        </div>
                    `;
                });

                searchResultsBox.innerHTML = resultsHTML;
            });
        }
    });
</script>
