<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dAROPrinter</title>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- External CSS Styles -->
    <link rel="stylesheet" href="css/store.css">

    <style>
        /* --- ស្ទីលសម្រាប់ Sidebar ឱ្យរត់ជា Grid ២ កូឡោនទាំងអស់គ្នា --- */
        .sidebar-menu-list {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 8px !important;
        }

        /* ចំណងជើង Category និង All Products ឱ្យស៊ីប្រអប់ពេញ ២ កូឡោន */
        .sidebar-category-title {
            grid-column: span 2 !important;
            margin-top: 15px !important;
        }

        .sidebar-menu-list > .filter-trigger[data-filter="All"] {
            grid-column: span 2 !important;
        }

        .full-span {
            grid-column: span 2 !important;
        }

        .shop-sidebar .sidebar-menu-list .filter-trigger.active {
            background-color: #eff6ff !important;
            border-color: #3b82f6 !important;
            color: #2563eb !important;
        }

        /* --- ផ្នែក Brand Buttons (គ្រប់ប៊ូតុងទាំងអស់ដែលមាន Logo) --- */
        .firmware-grid {
            display: contents !important;
        }

        .shop-sidebar .brand-btn {
            grid-column: span 1 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            padding: 10px 4px !important;
            background-color: #f8fafc !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 8px !important;
            width: 100% !important;
            height: 100% !important;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0 !important;
        }

        .shop-sidebar .brand-btn:hover {
            background-color: #eff6ff !important;
            border-color: #3b82f6 !important;
        }

        .shop-sidebar .brand-btn img.brand-logo-icon {
            width: 50px !important;
            height: auto !important;
            object-fit: contain;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .shop-sidebar .brand-btn span {
            font-size: 11px !important;
            font-weight: 600 !important;
            color: #334155 !important;
        }
    </style>
</head>
<body>

    <!-- ទីតាំងសម្រាប់ទាញយក header.html មកដាក់ដោយស្វ័យប្រវត្តិ -->
    <div id="header-placeholder"></div>

    <!-- SHOP LAYOUT WRAPPER (Sidebar + Main Content) -->
    <div class="shop-layout-wrapper">
        
        <!-- Sidebar Menu ខាងឆ្វេង (Categories) -->
        <aside class="shop-sidebar" id="shopSidebar">
            <div class="sidebar-header">
                <h3><i class="fa-solid fa-list"></i> Categories</h3>
                <button class="close-sidebar" id="closeSidebar"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="sidebar-menu-list">
                <button class="filter-trigger active full-span" data-filter="All">Products (All)</button>
                
                <div class="sidebar-category-title">Copier Machine</div>
                <button class="filter-trigger full-span" data-filter="Copier">Copier</button>

                <div class="sidebar-category-title">Software Firmware</div>
                <div class="firmware-grid">
                    <button class="filter-trigger brand-btn" data-filter="Canon Firmware">
                        <img src="images/Logo/canon.png" alt="Canon" class="brand-logo-icon"> <span>FIRMWARE</span>
                    </button>
                    <button class="filter-trigger brand-btn" data-filter="Toshiba Firmware">
                        <img src="images/Logo/Toshiba.png" alt="Toshiba" class="brand-logo-icon"> <span>FIRMWARE</span>
                    </button>
                    <button class="filter-trigger brand-btn" data-filter="Ricoh Firmware">
                        <img src="images/Logo/ricoh.png" alt="Ricoh" class="brand-logo-icon"> <span>FIRMWARE</span>
                    </button>
                    <button class="filter-trigger brand-btn" data-filter="HP Firmware">
                        <img src="images/Logo/hp.png" alt="HP" class="brand-logo-icon"> <span>FIRMWARE</span>
                    </button>
                </div>
         
                <div class="sidebar-category-title">Printers</div>
                <div class="firmware-grid">
                    <button class="filter-trigger brand-btn" data-filter="Ink Printer">
                        <img src="images/Logo/epson.png" alt="Ink Printer" class="brand-logo-icon"> <span>Ink Printer</span>
                    </button>
                    <button class="filter-trigger brand-btn" data-filter="Laser Printer">
                        <img src="images/Logo/brother.png" alt="Laser Printer" class="brand-logo-icon"> <span>Laser Printer</span>
                    </button>
                    <button class="filter-trigger brand-btn full-span" data-filter="Large Format Printer">
                        <img src="images/Logo/hp.png" alt="Large Format Printer" class="brand-logo-icon" style="width: 35px !important;"> <span>Large Format Printer</span>
                    </button>
                </div>

                <div class="sidebar-category-title">Printer Parts & Accessories</div>
                <div class="firmware-grid">
                    <button class="filter-trigger brand-btn" data-filter="Printer Parts">
                        <img src="images/Logo/canon.png" alt="Printer Parts" class="brand-logo-icon"> <span>Printer Parts</span>
                    </button>
                    <button class="filter-trigger brand-btn" data-filter="Toner and Ink">
                        <img src="images/Logo/ricoh.png" alt="Toner & Ink" class="brand-logo-icon"> <span>Toner & Ink</span>
                    </button>
                </div>

                <div class="sidebar-category-title">Software License</div>
                <div class="firmware-grid">
                    <button class="filter-trigger brand-btn" data-filter="Windows">
                        <img src="images/Logo/windows.png" alt="Windows" class="brand-logo-icon"> <span>Windows</span>
                    </button>
                    <button class="filter-trigger brand-btn" data-filter="Microsoft Office">
                        <img src="images/Logo/office.png" alt="Microsoft Office" class="brand-logo-icon"> <span>Microsoft Office</span>
                    </button>
                    <button class="filter-trigger brand-btn" data-filter="Utilities Software">
                        <img src="images/Logo/utilities.png" alt="Utilities Software" class="brand-logo-icon"> <span>Utilities Software</span>
                    </button>
                    <button class="filter-trigger brand-btn" data-filter="Software Tools & Actions">
                        <img src="images/Logo/tools.png" alt="Software Tools" class="brand-logo-icon"> <span>Software Tools</span>
                    </button>
                </div>
            </div>
        </aside>
        
        <!-- ផ្ទាំងខាងស្តាំសម្រាប់បង្ហាញ Search Bar និងផលិតផល -->
        <main class="shop-main-content">
            <!-- Search Bar -->
            <div class="search-section">
                <div class="search-box">
                    <input type="text" id="searchInput" placeholder="Products & Firmware...">
                </div>
            </div>

            <!-- ប៊ូតុងបើក Menu លើទូរស័ព្ទ (Categories ≡) -->
            <button class="mobile-filter-toggle" id="mobileFilterToggle">
                Categories <i class="fa-solid fa-bars"></i>
            </button>

            <!-- ទីតាំងបង្ហាញបញ្ជីទំនិញ ឬ Sections តាម JS -->
            <div id="main-content-container">
                <!-- ផលិតផលនឹងរត់ចូលមកទីនេះដោយស្វ័យប្រវត្តិ -->
            </div>
        </main>
    </div>

    <!-- ទីតាំងសម្រាប់ទាញយក footer/footer.html មកដាក់ដោយស្វ័យប្រវត្តិ -->
    <div id="footer-placeholder"></div>

    <!-- JavaScript for Mobile Menu & Sidebar Toggle -->
    <script>
        const menuToggle = document.getElementById('menuToggle');
        const navMenu = document.getElementById('navMenu');

        if (menuToggle && navMenu) {
            menuToggle.addEventListener('click', () => {
                navMenu.classList.toggle('active');
            });
        }

        const mobileFilterToggle = document.getElementById('mobileFilterToggle');
        const shopSidebar = document.getElementById('shopSidebar');
        const closeSidebar = document.getElementById('closeSidebar');

        if (mobileFilterToggle && shopSidebar) {
            mobileFilterToggle.addEventListener('click', () => {
                shopSidebar.classList.add('active');
            });

            if (closeSidebar) {
                closeSidebar.addEventListener('click', () => {
                    shopSidebar.classList.remove('active');
                });
            }

            document.addEventListener('click', (e) => {
                if (!shopSidebar.contains(e.target) && !mobileFilterToggle.contains(e.target)) {
                    shopSidebar.classList.remove('active');
                }
            });
        }
    </script>

    <!-- Connect External JavaScript -->
    <script src="include.js"></script>
    <script src="store.js"></script>
    
    <!-- Script សម្រាប់ទាញយក Footer មកដាក់តាម id="footer-placeholder" -->
    <script>
        fetch('footer.html')
            .then(response => response.text())
            .then(data => {
                document.getElementById('footer-placeholder').innerHTML = data;
            })
            .catch(error => console.error('Error loading footer:', error));
    </script>
</body>
</html>
