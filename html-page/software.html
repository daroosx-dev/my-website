<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>daroPrinter - Software & Drivers Store</title>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Files -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/home-style.css">
    <link rel="stylesheet" href="../store.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Leelawadee UI', 'Khmer OS Siemreap', 'Segoe UI', sans-serif;
        }

        body {
            background-color: #f5f6f8;
            color: #333333;
            overflow-x: hidden;
            padding-top: 70px; /* ទប់កុំឱ្យ Header បាំងមាតិកា */
        }

        /* Software Container & Tabs Styling */
        .software-container {
            max-width: 900px;
            margin: 30px auto 50px auto;
            padding: 0 15px;
        }

        .software-tabs {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }

        .sw-tab-btn {
            background-color: #e2e8f0;
            color: #334155;
            border: none;
            padding: 12px 25px;
            font-size: 15px;
            font-weight: 700;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sw-tab-btn:hover {
            background-color: #cbd5e1;
        }

        .sw-tab-btn.active {
            background-color: #2563eb;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);
        }

        /* Software List Grid */
        .software-list-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .software-card-item {
            display: flex;
            background: #ffffff;
            border: 1px solid #dcdcdc;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border-radius: 6px;
        }

        .software-card-item:hover {
            border-color: #2563eb;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        .sw-img-box {
            flex: 0 0 160px;
            height: 120px;
            background: #2b3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            overflow: hidden;
            cursor: pointer;
            border-radius: 4px;
        }

        .sw-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sw-content-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
        }

        .sw-header-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .sw-badge {
            background-color: #555;
            color: #fff;
            padding: 3px 10px;
            font-weight: bold;
            border-radius: 3px 0 0 3px;
            font-size: 11px;
        }

        .sw-category {
            background-color: #eee;
            color: #444;
            padding: 3px 10px;
            border-radius: 0 3px 3px 0;
            border-left: 1px solid #ddd;
            font-size: 12px;
        }

        .sw-title {
            margin: 0 0 8px 0;
            font-size: 18px;
        }

        .sw-title a {
            color: #2563eb;
            text-decoration: none;
        }

        .sw-title a:hover {
            text-decoration: underline;
        }

        .sw-desc {
            margin: 0;
            font-size: 13px;
            color: #333;
            line-height: 1.5;
        }

        .more-link {
            color: #0073aa;
            text-decoration: none;
            font-weight: bold;
        }
        .more-link:hover {
            text-decoration: underline;
        }

        @media (max-width: 992px) {
            .software-tabs {
                flex-direction: column;
            }
            .software-card-item {
                flex-direction: column;
            }
            .sw-img-box {
                width: 100%;
                height: 180px;
                margin-right: 0;
                margin-bottom: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- ទីតាំងសម្រាប់ទាញយក Header ដោយស្វ័យប្រវត្តិពី include.js -->
    <div id="header-placeholder"></div>

    <!-- Software Container with 2 Main Tabs -->
    <div class="software-container">
        <!-- Main 2 Tabs: Driver vs Computer -->
        <div class="software-tabs">
            <button class="sw-tab-btn active" onclick="filterSoftwareCategory('Driver', event)">
                <i class="fa-solid fa-print" aria-hidden="true"></i> Driver
            </button>
            <button class="sw-tab-btn" onclick="filterSoftwareCategory('Computer', event)">
                <i class="fa-solid fa-laptop" aria-hidden="true"></i> Computer
            </button>
        </div>

        <!-- Software List Grid -->
        <div class="software-list-container" id="softwareListGrid">
            <p style="text-align: center; color: #666; padding: 40px;">កំពុងផ្ទុកទិន្នន័យ...</p>
        </div>
    </div>

    <!-- ទីតាំងសម្រាប់ទាញយក Footer ដោយស្វ័យប្រវត្តិពី include.js -->
    <div id="footer-placeholder"></div>

    <!-- JavaScript សម្រាប់ដំណើរការទំព័រ -->
    <script>
        let allSoftwareData = [];

        function createSoftwareCard(prod) {
            let imgSrc = '../images/default.png';
            if (prod.images && prod.images.length > 0) {
                imgSrc = prod.images[0].startsWith('../') ? prod.images[0] : '../' + prod.images[0];
            } else if (prod.image) {
                imgSrc = prod.image.startsWith('../') ? prod.image : '../' + prod.image;
            }

            let category = prod.category || 'Utilities';
            let dateStr = prod.date || '1 DAY AGO';
            let displayTitle = prod.custom_title || prod.name;
            let targetLink = prod.custom_link || `single-product.html?id=${prod.id}`;
            let linkTarget = prod.custom_link ? 'target="_blank"' : '';

            return `
                <div class="software-card-item">
                    <div class="sw-img-box" onclick="window.open('${targetLink}', '_blank')">
                        <img src="${imgSrc}" alt="${displayTitle}">
                    </div>
                    <div class="sw-content-box">
                        <div class="sw-header-row">
                            <span class="sw-badge"><i class="fa-solid fa-clock" aria-hidden="true"></i> ${dateStr}</span>
                            <span class="sw-category">in <a href="#">${category}</a></span>
                        </div>
                        <h3 class="sw-title">
                            <a href="${targetLink}" ${linkTarget}>${displayTitle}</a>
                        </h3>
                        <p class="sw-desc">
                            ${prod.description || prod.name + ' Download Latest Version.'} 
                            <a href="${targetLink}" ${linkTarget} class="more-link">(MORE...)</a>
                        </p>
                    </div>
                </div>
            `;
        }

        function renderSoftwareList(list) {
            const gridContainer = document.getElementById('softwareListGrid');
            if (list.length === 0) {
                gridContainer.innerHTML = '<p style="text-align: center; color: #666; padding: 30px;">មិនមានទិន្នន័យសម្រាប់បង្ហាញក្នុងផ្នែកនេះទេ</p>';
                return;
            }
            gridContainer.innerHTML = list.map(prod => createSoftwareCard(prod)).join('');
        }

        function filterSoftwareCategory(type, event) {
            document.querySelectorAll('.sw-tab-btn').forEach(btn => btn.classList.remove('active'));
            event.currentTarget.classList.add('active');

            let filtered = [];
            if (type === 'Driver') {
                filtered = allSoftwareData.filter(item => {
                    let cat = (item.category || '').toLowerCase();
                    let name = (item.name || '').toLowerCase();
                    return cat.includes('printer') || cat.includes('copier') || cat.includes('label') || 
                           name.includes('printer') || name.includes('copier') || name.includes('label');
                });
            } else if (type === 'Computer') {
                filtered = allSoftwareData.filter(item => {
                    let cat = (item.category || '').toLowerCase();
                    let name = (item.name || '').toLowerCase();
                    return cat.includes('windows') || cat.includes('mac') || 
                           name.includes('windows') || name.includes('mac') || name.includes('office');
                });
            }
            renderSoftwareList(filtered);
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const gridContainer = document.getElementById('softwareListGrid');
            try {
                const response = await fetch('../json/software.json');
                if (!response.ok) throw new Error('Cannot load software.json');
                allSoftwareData = await response.json();

                let initialFiltered = allSoftwareData.filter(item => {
                    let cat = (item.category || '').toLowerCase();
                    let name = (item.name || '').toLowerCase();
                    return cat.includes('printer') || cat.includes('copier') || cat.includes('label') || 
                           name.includes('printer') || name.includes('copier') || name.includes('label');
                });
                renderSoftwareList(initialFiltered);

            } catch (err) {
                console.error(err);
                gridContainer.innerHTML = '<p style="text-align: center; color: red;">មានបញ្ហាក្នុងការទាញយកទិន្នន័យ Software មកបង្ហាញ។</p>';
            }
        });
    </script>

    <!-- Linking include.js (ស្ថិតនៅថត Root ខាងក្រៅ ដូច្នេះត្រូវថយក្រោយ ១ កម្រិត ../include.js) -->
    <script src="../include.js"></script>
</body>
</html>
