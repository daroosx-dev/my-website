<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>daroPrinter - Software & Drivers Store</title>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- CSS Files -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="../css/home-style.css">
    <link rel="stylesheet" href="../store.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Leelawadee UI', 'Khmer OS Siemreap', 'Segoe UI', sans-serif;
        }

        body {
            background-color: #f5f6f8;
            color: #333333;
            overflow-x: hidden;
            padding-top: 70px;
        }

        .software-page-wrapper {
            max-width: 1200px;
            margin: 30px auto 50px auto;
            padding: 0 15px;
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        /* ស្ទីល Sidebar Categories ខាងឆ្វេង */
        .software-sidebar {
            flex: 0 0 280px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.02);
        }

        .software-sidebar h3 {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sidebar-category-list {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .sidebar-category-list li a {
            display: block;
            padding: 10px 12px;
            color: #334155;
            text-decoration: none;
            font-size: 14px;
            font-weight: 500;
            border-radius: 6px;
            transition: all 0.2s ease;
        }

        .sidebar-category-list li a:hover,
        .sidebar-category-list li a.active {
            background-color: #eff6ff;
            color: #2563eb;
            font-weight: 600;
        }

        .sidebar-section-title {
            font-size: 11px;
            font-weight: 700;
            color: #64748b;
            margin: 15px 0 5px 10px;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #d4af37; /* បន្ទាត់ពណ៌មាស */
            padding-bottom: 4px;
        }

        .software-main-content {
            flex: 1;
            min-width: 0;
        }

        .software-list-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        /* ស្ទីលសម្រាប់កាតទំនិញ */
        .software-card-item {
            display: flex;
            background: #ffffff;
            border: 1px solid #dcdcdc;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: all 0.3s ease;
            border-radius: 6px;
            position: relative;
        }

        .software-card-item:hover {
            border-color: #2563eb;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }

        /* ស្ទីលសម្រាប់លេខរៀង (Number Badge) ពណ៌មាស */
        .sw-item-number {
            position: absolute;
            top: 10px;
            right: 15px;
            background-color: #d4af37;
            color: #fff;
            font-size: 12px;
            font-weight: bold;
            padding: 2px 8px;
            border-radius: 4px;
        }

        .sw-img-box {
            flex: 0 0 160px;
            height: 120px;
            background: #2b3e50;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-right: 15px;
            overflow: hidden;
            cursor: pointer;
            border-radius: 4px;
        }

        .sw-img-box img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .sw-content-box {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            padding-right: 30px;
        }

        .sw-header-row {
            display: flex;
            align-items: center;
            margin-bottom: 8px;
            font-size: 13px;
        }

        .sw-badge {
            background-color: #555;
            color: #fff;
            padding: 3px 10px;
            font-weight: bold;
            border-radius: 3px 0 0 3px;
            font-size: 11px;
        }

        .sw-category {
            background-color: #eee;
            color: #444;
            padding: 3px 10px;
            border-radius: 0 3px 3px 0;
            border-left: 1px solid #ddd;
            font-size: 12px;
        }

        .sw-title {
            margin: 0 0 8px 0;
            font-size: 18px;
        }

        .sw-title a {
            color: #2563eb;
            text-decoration: none;
        }

        .sw-title a:hover {
            text-decoration: underline;
        }

        .sw-desc {
            margin: 0;
            font-size: 13px;
            color: #333;
            line-height: 1.5;
        }

        .more-link {
            color: #0073aa;
            text-decoration: none;
            font-weight: bold;
        }
        .more-link:hover {
            text-decoration: underline;
        }

        /* Pagination Buttons Style */
        .pagination-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-top: 30px;
        }

        .page-btn {
            background-color: #ffffff;
            color: #334155;
            border: 1px solid #cbd5e1;
            padding: 8px 14px;
            font-size: 14px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .page-btn:hover {
            background-color: #eff6ff;
            border-color: #2563eb;
            color: #2563eb;
        }

        .page-btn.active {
            background-color: #2563eb;
            border-color: #2563eb;
            color: #ffffff;
        }

        @media (max-width: 992px) {
            .software-page-wrapper {
                flex-direction: column;
            }
            .software-sidebar {
                width: 100%;
            }
            .software-card-item {
                flex-direction: column;
            }
            .sw-img-box {
                width: 100%;
                height: 180px;
                margin-right: 0;
                margin-bottom: 12px;
            }
        }
    </style>
</head>
<body>

    <!-- Header Placeholder -->
    <div id="header-placeholder"></div>

    <div class="software-page-wrapper">
        
        <!-- Sidebar Categories ខាងឆ្វេង -->
        <aside class="software-sidebar">
            <h3><i class="fa-solid fa-list" aria-hidden="true"></i> Categories</h3>
            <ul class="sidebar-category-list">
                <li><a href="#" onclick="filterByCategory('all', event)" class="active" id="cat-all">Products (All)</a></li>

                <div class="sidebar-section-title">SOFTWARE</div>
                <li><a href="#" onclick="filterByCategory('windows', event)" id="cat-windows">Windows Software</a></li>
                <li><a href="#" onclick="filterByCategory('mac', event)" id="cat-mac">Mac Software</a></li>
                <li><a href="#" onclick="filterByCategory('utilities', event)" id="cat-utilities">Utilities Software</a></li>

                <div class="sidebar-section-title">DRIVERS & FIRMWARE</div>
                <li><a href="#" onclick="filterByCategory('printer', event)" id="cat-printer">Printer Driver</a></li>
                <li><a href="#" onclick="filterByCategory('label', event)" id="cat-label">Label Printer Driver</a></li>
                <li><a href="#" onclick="filterByCategory('copier', event)" id="cat-copier">Copier Driver</a></li>
            </ul>
        </aside>

        <!-- Software Main Content -->
        <div class="software-main-content">
            <div class="software-list-container" id="softwareListGrid">
                <p style="text-align: center; color: #666; padding: 40px;">កំពុងផ្ទុកទិន្នន័យ...</p>
            </div>
            <!-- Pagination Control Box -->
            <div class="pagination-container" id="paginationContainer"></div>
        </div>

    </div>

    <!-- Footer Placeholder -->
    <div id="footer-placeholder"></div>

    <!-- JavaScript សម្រាប់គ្រប់គ្រងទិន្នន័យ លេខរៀង និង Pagination -->
    <script>
        let allSoftwareData = [];
        let currentFilteredData = [];
        let currentPage = 1;
        const itemsPerPage = 5; // កំណត់បង្ហាញ 5 ទំនិញក្នុងមួយទំព័រ

        function createSoftwareCard(prod, index) {
            let imgSrc = '../images/default.png';
            if (prod.images && prod.images.length > 0) {
                imgSrc = prod.images[0].startsWith('../') ? prod.images[0] : '../' + prod.images[0];
            } else if (prod.image) {
                imgSrc = prod.image.startsWith('../') ? prod.image : '../' + prod.image;
            }

            let category = prod.category || 'Utilities';
            let dateStr = prod.date || '1 DAY AGO';
            let displayTitle = prod.custom_title || prod.name;
            let targetLink = prod.custom_link || `single-product.html?id=${prod.id}`;
            let linkTarget = prod.custom_link ? 'target="_blank"' : '';

            return `
                <div class="software-card-item">
                    <div class="sw-item-number">${index + 1}</div>
                    <div class="sw-img-box" onclick="window.open('${targetLink}', '_blank')">
                        <img src="${imgSrc}" alt="${displayTitle}">
                    </div>
                    <div class="sw-content-box">
                        <div class="sw-header-row">
                            <span class="sw-badge"><i class="fa-solid fa-clock" aria-hidden="true"></i> ${dateStr}</span>
                            <span class="sw-category">in <a href="#">${category}</a></span>
                        </div>
                        <h3 class="sw-title">
                            <a href="${targetLink}" ${linkTarget}>${displayTitle}</a>
                        </h3>
                        <p class="sw-desc">
                            ${prod.description || prod.name + ' Download Latest Version.'} 
                            <a href="${targetLink}" ${linkTarget} class="more-link">(MORE...)</a>
                        </p>
                    </div>
                </div>
            `;
        }

        function renderPageData() {
            const gridContainer = document.getElementById('softwareListGrid');
            if (currentFilteredData.length === 0) {
                gridContainer.innerHTML = '<p style="text-align: center; color: #666; padding: 30px;">មិនមានទិន្នន័យសម្រាប់បង្ហាញក្នុងផ្នែកនេះទេ</p>';
                document.getElementById('paginationContainer').innerHTML = '';
                return;
            }

            let start = (currentPage - 1) * itemsPerPage;
            let end = start + itemsPerPage;
            let paginatedItems = currentFilteredData.slice(start, end);

            gridContainer.innerHTML = paginatedItems.map((prod, idx) => createSoftwareCard(prod, start + idx)).join('');
            renderPaginationControls();
        }

        function renderPaginationControls() {
            const paginationContainer = document.getElementById('paginationContainer');
            let totalPages = Math.ceil(currentFilteredData.length / itemsPerPage);

            if (totalPages <= 1) {
                paginationContainer.innerHTML = '';
                return;
            }

            let buttonsHtml = '';
            for (let i = 1; i <= totalPages; i++) {
                let activeClass = (i === currentPage) ? 'active' : '';
                buttonsHtml += `<button class="page-btn ${activeClass}" onclick="changePage(${i})">${i}</button>`;
            }
            paginationContainer.innerHTML = buttonsHtml;
        }

        function changePage(page) {
            currentPage = page;
            renderPageData();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function filterByCategory(catKey, event) {
            if (event) event.preventDefault();
            
            document.querySelectorAll('.sidebar-category-list a').forEach(a => a.classList.remove('active'));
            let activeEl = document.getElementById('cat-' + catKey);
            if (activeEl) activeEl.classList.add('active');

            currentPage = 1; // Reset ទៅទំព័រទី១ វិញពេលប្តូរ Category

            if (catKey === 'all') {
                currentFilteredData = allSoftwareData;
            } else {
                currentFilteredData = allSoftwareData.filter(item => {
                    let cat = (item.category || '').toLowerCase();
                    return cat === catKey.toLowerCase();
                });
            }
            renderPageData();
        }

        document.addEventListener("DOMContentLoaded", async () => {
            const gridContainer = document.getElementById('softwareListGrid');
            try {
                const response = await fetch('../json/software.json');
                if (!response.ok) throw new Error('Cannot load software.json');
                allSoftwareData = await response.json();

                currentFilteredData = allSoftwareData;
                renderPageData();

            } catch (err) {
                console.error(err);
                gridContainer.innerHTML = '<p style="text-align: center; color: red;">មានបញ្ហាក្នុងការទាញយកទិន្នន័យ Software មកបង្ហាញ។</p>';
            }
        });
    </script>

    <!-- Linking include.js -->
    <script src="../include.js"></script>
</body>
</html>
