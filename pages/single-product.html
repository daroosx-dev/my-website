<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Product Detail - DPrinteraro</title>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Link CSS (ថយក្រោយមួយថតដើម្បីហៅ style.css) -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="single-product.css">
</head>
<body>

    <!-- Top Bar Header -->
    <div class="top-bar">
        <div class="top-info">
            <span><i class="fa-solid fa-headset"></i> Phone: 010 111 222 | 097 333 444</span>
        </div>
        <div class="social-icons">
            <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" aria-label="TikTok"><i class="fa-brands fa-tiktok"></i></a>
            <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
            <a href="https://t.me/your_telegram_username" target="_blank" aria-label="Telegram"><i class="fa-brands fa-telegram"></i></a>
        </div>
    </div>

    <!-- Main Navigation Header -->
    <header class="apple-header">
        <nav class="apple-nav">
            <a href="../index.html" class="nav-logo">
                <span class="logo-blue">daro</span>printer
            </a>
            
            <div class="nav-menu" id="navMenu">
                <a href="../index.html">Store</a>
                <a href="../index.html">Software Firmware</a>
                <a href="../index.html">Printer</a>
                <a href="../index.html">Support</a>
            </div>
        </nav>
    </header>

    <!-- Breadcrumb -->
    <div class="breadcrumb-container">
        <nav class="breadcrumb">
            <a href="../index.html">ទំព័រដើម</a> <span class="separator">/</span> 
            <span id="breadcrumbCategory" class="current">Products</span> <span class="separator">/</span> 
            <span class="current" id="breadcrumbName">ព័ត៌មានលម្អិត</span>
        </nav>
    </div>

    <!-- Main Product Section -->
    <main class="single-product-main">
        <div class="product-layout" id="productDetailContainer">
            <p style="text-align: center; grid-column: 1 / -1; padding: 40px;">កំពុងផ្ទុកទិន្ន័យផលិតផល...</p>
        </div>

        <!-- Detailed Information Box (Specs Style) -->
        <section class="detailed-info-container" id="specsSection" style="display: none;">
            <table class="specs-table" id="specsContainerTable">
                <!-- Data specs នឹងរៀបចំដាក់ទីនេះស្វ័យប្រវត្តិ -->
            </table>
        </section>
    </main>

    <!-- JavaScript for Single Product Page Data Binding -->
    <script>
        // មុខងារប្តូររូបភាពពេលចុចលើ Thumbnail
        function changeImage(el) {
            const mainImg = document.getElementById('productImage');
            if (mainImg) {
                mainImg.src = el.src;
            }
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById('productDetailContainer');
            const specsSection = document.getElementById('specsSection');
            const breadcrumbName = document.getElementById('breadcrumbName');
            const breadcrumbCategory = document.getElementById('breadcrumbCategory');
            const pageTitle = document.getElementById('pageTitle');

            // 1. ទាញយក ID ពី URL (ឧទាហរណ៍: single-product.html?id=1)
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                container.innerHTML = '<p style="text-align: center; color: red; grid-column: 1 / -1;">រកមិនឃើញលេខសម្គាល់ផលិតផល (Product ID) ទេ។</p>';
                return;
            }

            // 2. ទាញយកទិន្ន័យពី products.json (ស្ថិតនៅថ្នាក់ក្រៅ pages/ ដូច្នេះត្រូវប្រើ ../products.json)
            fetch('../products.json')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(products => {
                    // 3. ស្វែងរកទំនិញដែលត្រូវនឹង ID
                    const product = products.find(p => String(p.id) === String(productId));

                    if (!product) {
                        container.innerHTML = '<p style="text-align: center; color: red; grid-column: 1 / -1;">មិនមានទិន្ន័យសម្រាប់ផលិតផលនេះទេ!</p>';
                        return;
                    }

                    pageTitle.innerText = `${product.name} - DPrinteraro`;
                    breadcrumbName.innerText = product.name;
                    breadcrumbCategory.innerText = product.category || 'Product';

                    // 4. រៀបចំផ្លូវរូបភាព ( Image Paths )
                    let imagesList = [];
                    if (product.images && Array.isArray(product.images) && product.images.length > 0) {
                        imagesList = product.images.map(rawImg => {
                            if (!rawImg) return '../images/default.png';
                            return rawImg.startsWith('../') ? rawImg : (rawImg.startsWith('images/') ? '../' + rawImg : '../images/' + rawImg);
                        });
                    } else {
                        let rawImg = product.image || 'images/default.png';
                        imagesList = [rawImg.startsWith('../') ? rawImg : (rawImg.startsWith('images/') ? '../' + rawImg : '../images/' + rawImg)];
                    }

                    let mainImgSrc = imagesList[0];

                    let thumbnailsHTML = '';
                    imagesList.forEach((imgSrc, index) => {
                        let activeClass = index === 0 ? 'active' : '';
                        thumbnailsHTML += `<img src="${imgSrc}" alt="Thumb ${index + 1}" class="thumb ${activeClass}" onclick="changeImage(this)">`;
                    });

                    let tagsHTML = "";
                    if (product.tags && Array.isArray(product.tags)) {
                        product.tags.forEach(tag => {
                            tagsHTML += `<span class="tag">✓ ${tag}</span>`;
                        });
                    }

                    // ទាញយក custom_link (Telegram Link) មកដាក់បើមាន ឬប្រើតំណរភ្ជាប់លំនាំដើម
                    let telegramLink = product.custom_link ? product.custom_link : "https://t.me/your_telegram_username";

                    container.innerHTML = `
                        <!-- Left: Image Gallery -->
                        <div class="product-gallery-section">
                            <div class="main-preview-img">
                                <img id="productImage" src="${mainImgSrc}" alt="${product.name}">
                            </div>
                            <div class="thumbnail-row">
                                ${thumbnailsHTML}
                            </div>
                        </div>

                        <!-- Right: Product Info -->
                        <div class="product-info-section">
                            <div class="title-share-row">
                                <div>
                                    <span class="brand-badge">${product.brand ? product.brand.toUpperCase() : ''}</span>
                                    <h1 class="single-product-title" id="productTitle">${product.name}</h1>
                                    <p class="product-category-subtitle" id="productSubtitle">${product.subtitle || product.machine_type || ''}</p>
                                </div>
                            </div>

                            <div class="product-tags" id="productTags">
                                ${tagsHTML}
                            </div>

                            <h2 class="single-price" id="productPrice">${product.price || 'តម្លៃទំនាក់ទំនង'}</h2>

                            <div class="short-desc-box">
                                <div class="desc-box-title">
                                    <i class="fa-regular fa-file-lines"></i> Product Description
                                </div>
                                <p id="productDesc">${product.description || 'គ្មានការពន្យល់លម្អិត។'}</p>
                            </div>

                            <!-- ប៊ូតុង Telegram ភ្ជាប់ទៅកាន់ Link របស់ទំនិញនីមួយៗផ្ទាល់ -->
                            <a href="${telegramLink}" target="_blank" class="btn-contact-us">
                                <i class="fa-brands fa-telegram"></i> កុម្ម៉ង់ទិញ ឬសាកសួរព័ត៌មានតាម Telegram
                            </a>

                            <div class="delivery-stock-info">
                                <p class="delivery-text"><i class="fa-solid fa-truck-fast"></i> សេវាដឹកជញ្ជូនរហ័ស ស្ថាប័ននិងខេត្ត-ក្រុង</p>
                                <p class="stock-status"><i class="fa-solid fa-box"></i> ក្នុងស្តុក (In Stock)</p>
                            </div>
                        </div>
                    `;
                    
                    specsSection.style.display = 'block';
                    
                    // 5. តារាង Specs លម្អិត
                    let specsTableHTML = '';
                    if (product.specs && Array.isArray(product.specs) && product.specs.length > 0) {
                        product.specs.forEach(specGroup => {
                            specsTableHTML += `
                                <tr class="section-header">
                                    <td colspan="2">${specGroup.category}</td>
                                </tr>
                            `;
                            if (specGroup.rows && Array.isArray(specGroup.rows)) {
                                specGroup.rows.forEach(row => {
                                    specsTableHTML += `
                                        <tr>
                                            <td class="spec-label">${row.label}</td>
                                            <td class="spec-value">${row.val}</td>
                                        </tr>
                                    `;
                                });
                            }
                        });
                        document.getElementById('specsContainerTable').innerHTML = specsTableHTML;
                    } else {
                        document.getElementById('specsContainerTable').innerHTML = '<tr><td colspan="2" style="padding: 15px; color: #666; text-align: center;">មិនមានទិន្ន័យបច្ចេកទេសលម្អិតបន្ថែមទេសម្រាប់ផលិតផលនេះ។</td></tr>';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    container.innerHTML = '<p style="text-align: center; color: red; grid-column: 1 / -1;">មានបញ្ហាក្នុងការទាញយកទិន្ន័យ!</p>';
                });
        });
    </script>
</body>
</html>
