<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="pageTitle">Product Detail - daroprinter</title>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Link CSS -->
    <link rel="stylesheet" href="../style.css">
    <link rel="stylesheet" href="single-product.css">
    <!-- Header CSS -->
    <link rel="stylesheet" href="../header/header.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Leelawadee UI', 'Khmer OS Siemreap', 'Segoe UI', sans-serif;
        }

        body {
            background-color: #f5f6f8;
            color: #333333;
            overflow-x: hidden;
            padding-top: 80px; /* ទប់កុំឱ្យ Header បាំងអត្ថបទ */
        }

        /* --- BREADCRUMB STYLING (Center & Box Style with Ellipsis) --- */
        .breadcrumb-container {
            margin-bottom: 20px;
            display: flex;
            justify-content: center; /* ដាក់ចំកណ្ដាលផ្ដេក */
            width: 100%;
            padding: 0 15px;
        }

        .breadcrumb {
            display: flex;
            align-items: center;
            flex-wrap: nowrap; /* មិនឱ្យធ្លាក់ជួរចុះក្រោម */
            background-color: #ffffff;
            border: 1px solid #d2d2d7;
            border-radius: 8px;
            padding: 10px 18px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.03);
            font-size: 14px;
            max-width: 100%;
            overflow: hidden;
        }

        .breadcrumb a {
            color: #0071e3;
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 5px;
            flex-shrink: 0;
            transition: color 0.2s;
        }

        .breadcrumb a:hover {
            color: #004080;
            text-decoration: underline;
        }

        .breadcrumb .separator {
            color: #94a3b8;
            margin: 0 10px;
            flex-shrink: 0;
            font-size: 12px;
        }

        .breadcrumb .current {
            color: #334155;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis; /* បង្ហាញ ... បើអត្ថបទវែងពេក */
            max-width: 350px; /* កម្រិតប្រវែងអតិបរមាសម្រាប់ Desktop */
        }

        @media (max-width: 600px) {
            .breadcrumb .current {
                max-width: 150px; /* កម្រិតខ្លីជាងមុននៅលើទូរស័ព្ទដៃ */
            }
        }

        /* --- SHOP LAYOUT WRAPPER (Sidebar + Main Content) --- */
        .shop-layout-wrapper {
            max-width: 1450px;
            margin: 20px auto;
            padding: 0 20px;
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        /* Sidebar ខាងឆ្វេង (Sticky ជាប់ពេល Scroll) */
        .shop-sidebar {
            width: 270px;
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 10px;
            padding: 20px;
            position: sticky;
            top: 90px;
            flex-shrink: 0;
            box-shadow: 0 2px 8px rgba(0,0,0,0.03);
            z-index: 99;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 1px solid #eee;
        }

        .sidebar-header h3 {
            font-size: 15px;
            color: #1e293b;
            font-weight: 700;
        }

        .close-sidebar {
            display: none;
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: #64748b;
        }

        .sidebar-category-title {
            font-size: 11px;
            font-weight: 800;
            color: #64748b;
            text-transform: uppercase;
            margin: 12px 0 4px 0;
            letter-spacing: 0.5px;
            padding-bottom: 4px;
            border-bottom: 2px solid #d4af37; /* ពណ៌មាស */
            grid-column: span 2 !important;
        }

        /* --- ស្ទីលរៀបចំ Sidebar Menu ឱ្យរត់ជា Grid ២ កូឡោន --- */
        .sidebar-menu-list {
            display: grid !important;
            grid-template-columns: repeat(2, 1fr) !important;
            gap: 8px !important;
        }

        .sidebar-menu-list > .filter-trigger[data-filter="All"] {
            grid-column: span 2 !important;
        }

        .full-span {
            grid-column: span 2 !important;
        }

        .shop-sidebar .sidebar-menu-list .filter-trigger.active {
            background-color: #eff6ff !important;
            border-color: #3b82f6 !important;
            color: #2563eb !important;
        }

        /* --- ផ្នែក Brand Buttons (គ្រប់ប៊ូតុងទាំងអស់ដែលមាន Logo) --- */
        .firmware-grid {
            display: contents !important;
        }

        .shop-sidebar .brand-btn {
            grid-column: span 1 !important;
            display: flex !important;
            flex-direction: column !important;
            align-items: center !important;
            justify-content: center !important;
            text-align: center !important;
            padding: 10px 4px !important;
            background-color: #f8fafc !important;
            border: 1px solid #e2e8f0 !important;
            border-radius: 8px !important;
            width: 100% !important;
            height: 100% !important;
            cursor: pointer;
            transition: all 0.2s;
            margin-bottom: 0 !important;
        }

        .shop-sidebar .brand-btn:hover {
            background-color: #eff6ff !important;
            border-color: #3b82f6 !important;
        }

        .shop-sidebar .brand-btn img.brand-logo-icon {
            width: 50px !important;
            height: auto !important;
            object-fit: contain;
            margin-bottom: 6px;
            flex-shrink: 0;
        }

        .shop-sidebar .brand-btn span {
            font-size: 11px !important;
            font-weight: 600 !important;
            color: #334155 !important;
        }

        /* ផ្នែកខាងស្តាំ (Main Content) */
        .shop-main-content {
            flex-grow: 1;
            min-width: 0;
        }

        .mobile-filter-toggle {
            display: none;
            background: none;
            border: none;
            padding: 0;
            font-size: 16px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 15px;
            cursor: pointer;
            align-items: center;
            gap: 8px;
        }

        .mobile-filter-toggle i {
            font-size: 16px;
            color: #1e293b;
        }

        /* --- RESPONSIVE FOR MOBILE --- */
        @media (max-width: 900px) {
            .shop-layout-wrapper {
                flex-direction: column;
                padding: 0 10px;
            }

            .mobile-filter-toggle {
                display: flex;
            }

            .shop-sidebar {
                position: fixed;
                top: 0;
                left: -100%;
                width: 280px;
                height: 100%;
                z-index: 99999;
                background: #ffffff;
                transition: left 0.3s ease-in-out;
                box-shadow: 10px 0 25px rgba(0, 0, 0, 0.15);
                overflow-y: auto;
                border-radius: 0;
            }

            .shop-sidebar.active {
                left: 0;
            }

            .close-sidebar {
                display: block;
            }
        }
    </style>
</head>
<body>

    <!-- ១. ទីតាំងសម្រាប់ទាញយក header.html មកដាក់ដោយស្វ័យប្រវត្តិ -->
    <div id="header-placeholder"></div>

    <!-- SHOP LAYOUT WRAPPER (Sidebar + Main Content) -->
    <div class="shop-layout-wrapper">
        
        <!-- Sidebar Menu ខាងឆ្វេង (Categories) -->
        <aside class="shop-sidebar" id="shopSidebar">
            <div class="sidebar-header">
                <h3><i class="fa-solid fa-list"></i> Categories</h3>
                <button class="close-sidebar" id="closeSidebar"><i class="fa-solid fa-xmark"></i></button>
            </div>
            <div class="sidebar-menu-list">
                <button class="filter-trigger active full-span" data-filter="All">Products (All)</button>
                
                <div class="sidebar-category-title">Copier Machine</div>
                <button class="filter-trigger brand-btn full-span" data-filter="Copier">
                    <img src="../images/Logo/toshiba.png" alt="Copier" class="brand-logo-icon"> <span>Copier</span>
                </button>

                <div class="sidebar-category-title">Software Firmware</div>
                <div class="firmware-grid">
                    <button class="filter-trigger brand-btn" data-filter="Canon Firmware">
                        <img src="../images/Logo/canon.png" alt="Canon" class="brand-logo-icon"> <span>FIRMWARE</span>
                    </button>
                    <button class="filter-trigger brand-btn" data-filter="Toshiba Firmware">
                        <img src="../images/Logo/toshiba.png" alt="Toshiba" class="brand-logo-icon"> <span>FIRMWARE</span>
                    </button>
                    <button class="filter-trigger brand-btn" data-filter="Ricoh Firmware">
                        <img src="../images/Logo/ricoh.png" alt="Ricoh" class="brand-logo-icon"> <span>FIRMWARE</span>
                    </button>
                    <button class="filter-trigger brand-btn" data-filter="HP Firmware">
                        <img src="../images/Logo/hp.png" alt="HP" class="brand-logo-icon"> <span>FIRMWARE</span>
                    </button>
                </div>
         
                <div class="sidebar-category-title">Printers</div>
                <div class="firmware-grid">
                    <button class="filter-trigger brand-btn" data-filter="Ink Printer">
                        <img src="../images/Logo/canon.png" alt="Ink Printer" class="brand-logo-icon"> <span>Ink Printer</span>
                    </button>
                    <button class="filter-trigger brand-btn" data-filter="Laser Printer">
                        <img src="../images/Logo/hp.png" alt="Laser Printer" class="brand-logo-icon"> <span>Laser Printer</span>
                    </button>
                    <button class="filter-trigger brand-btn full-span" data-filter="Large Format Printer">
                        <img src="../images/Logo/epson.png" alt="Large Format Printer" class="brand-logo-icon" style="width: 35px !important;"> <span>Large Format Printer</span>
                    </button>
                </div>

                <div class="sidebar-category-title">Printer Parts & Accessories</div>
                <div class="firmware-grid">
                    <button class="filter-trigger brand-btn" data-filter="Printer Parts">
                        <img src="../images/Logo/ricoh.png" alt="Printer Parts" class="brand-logo-icon"> <span>Printer Parts</span>
                    </button>
                    <button class="filter-trigger brand-btn" data-filter="Toner and Ink">
                        <img src="../images/Logo/hp.png" alt="Toner & Ink" class="brand-logo-icon"> <span>Toner & Ink</span>
                    </button>
                </div>

                <div class="sidebar-category-title">Software License</div>
                <div class="firmware-grid">
                    <button class="filter-trigger brand-btn" data-filter="Windows">
                        <img src="../images/Logo/windows.png" alt="Windows" class="brand-logo-icon"> <span>Windows</span>
                    </button>
                    <button class="filter-trigger brand-btn" data-filter="Microsoft Office">
                        <img src="../images/Logo/office.png" alt="Microsoft Office" class="brand-logo-icon"> <span>Microsoft Office</span>
                    </button>
                    <button class="filter-trigger brand-btn" data-filter="Utilities Software">
                        <img src="../images/Logo/utilities.png" alt="Utilities Software" class="brand-logo-icon"> <span>Utilities Software</span>
                    </button>
                    <button class="filter-trigger brand-btn" data-filter="Software Tools & Actions">
                        <img src="../images/Logo/tools.png" alt="Software Tools" class="brand-logo-icon"> <span>Software Tools</span>
                    </button>
                </div>
            </div>
        </aside>
        
        <!-- ផ្នែកខាងស្តាំសម្រាប់បង្ហាញព័ត៌មានលម្អិតទំនិញ -->
        <main class="shop-main-content">
            <!-- ប៊ូតុងបើក Menu លើទូរស័ព្ទ (Categories ≡) -->
            <button class="mobile-filter-toggle" id="mobileFilterToggle">
                Categories <i class="fa-solid fa-bars"></i>
            </button>

            <!-- Breadcrumb -->
            <div class="breadcrumb-container">
                <nav class="breadcrumb">
                    <a href="../index.html"><i class="fa-solid fa-house"></i></a> <span class="separator">/</span> 
                    <a href="../store.html" id="breadcrumbCategoryLink"><span id="breadcrumbCategory">Products</span></a> <span class="separator">/</span> 
                    <span class="current" id="breadcrumbName" title="">ព័ត៌មានលម្អិត</span>
                </nav>
            </div>

            <!-- Main Product Section -->
            <div class="single-product-main">
                <div class="product-layout" id="productDetailContainer">
                    <p style="text-align: center; grid-column: 1 / -1; padding: 40px;">កំពុងផ្ទុកទិន្នន័យផលិតផល...</p>
                </div>

                <!-- Detailed Information Box (Specs Style) -->
                <section class="detailed-info-container" id="specsSection" style="display: none; margin-top: 20px;">
                    <table class="specs-table" id="specsContainerTable">
                        <!-- Data specs នឹងរៀបចំដាក់ទីនេះស្វ័យប្រវត្តិ -->
                    </table>
                </section>
            </div>
        </main>
    </div>

    <!-- ២. ទីតាំងសម្រាប់ទាញយក footer.html មកដាក់ដោយស្វ័យប្រវត្តិ -->
    <div id="footer-placeholder"></div>

    <!-- JavaScript for Mobile Menu, Sidebar Toggle & Product Details -->
    <script>
        const mobileFilterToggle = document.getElementById('mobileFilterToggle');
        const shopSidebar = document.getElementById('shopSidebar');
        const closeSidebar = document.getElementById('closeSidebar');

        if (mobileFilterToggle && shopSidebar) {
            mobileFilterToggle.addEventListener('click', () => {
                shopSidebar.classList.add('active');
            });

            if (closeSidebar) {
                closeSidebar.addEventListener('click', () => {
                    shopSidebar.classList.remove('active');
                });
            }

            document.addEventListener('click', (e) => {
                if (!shopSidebar.contains(e.target) && !mobileFilterToggle.contains(e.target)) {
                    shopSidebar.classList.remove('active');
                }
            });
        }

        // Handle Filter Buttons in Sidebar to jump to store.html with parameter
        const filterTriggers = document.querySelectorAll('.filter-trigger');
        filterTriggers.forEach(button => {
            button.addEventListener('click', (e) => {
                e.preventDefault();
                const filterValue = button.getAttribute('data-filter');
                if (filterValue === 'All') {
                    window.location.href = '../store.html';
                } else {
                    window.location.href = `../store.html?filter=${encodeURIComponent(filterValue)}`;
                }
            });
        });

        // មុខងារប្តូររូបភាពពេលចុចលើ Thumbnail
        function changeImage(el) {
            const mainImg = document.getElementById('productImage');
            if (mainImg) {
                mainImg.src = el.src;
            }
            document.querySelectorAll('.thumb').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
        }

        document.addEventListener("DOMContentLoaded", () => {
            const container = document.getElementById('productDetailContainer');
            const specsSection = document.getElementById('specsSection');
            const breadcrumbName = document.getElementById('breadcrumbName');
            const breadcrumbCategory = document.getElementById('breadcrumbCategory');
            const breadcrumbCategoryLink = document.getElementById('breadcrumbCategoryLink');
            const pageTitle = document.getElementById('pageTitle');

            // 1. ទាញយក ID ពី URL
            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                container.innerHTML = '<p style="text-align: center; color: red; grid-column: 1 / -1;">រកមិនឃើញលេខសម្គាល់ផលិតផល (Product ID) ទេ។</p>';
                return;
            }

            // 2. ទាញយកទិន្នន័យពី products.json
            fetch('../products.json')
                .then(response => {
                    if (!response.ok) throw new Error('Network response was not ok');
                    return response.json();
                })
                .then(products => {
                    window.allProducts = products;

                    const product = products.find(p => String(p.id) === String(productId));

                    if (!product) {
                        container.innerHTML = '<p style="text-align: center; color: red; grid-column: 1 / -1;">មិនមានទិន្ន័យសម្រាប់ផលិតផលនេះទេ!</p>';
                        return;
                    }

                    pageTitle.innerText = `${product.name} - daroprinter`;
                    
                    breadcrumbName.innerText = product.name;
                    breadcrumbName.setAttribute('title', product.name);

                    const categoryName = product.category || 'Product';
                    breadcrumbCategory.innerText = categoryName;
                    breadcrumbCategoryLink.href = `../store.html?filter=${encodeURIComponent(categoryName)}`;

                    // 4. រៀបចំផ្លូវរូបភាព ( Image Paths )
                    let imagesList = [];
                    if (product.images && Array.isArray(product.images) && product.images.length > 0) {
                        imagesList = product.images.map(rawImg => {
                            if (!rawImg) return '../images/default.png';
                            return rawImg.startsWith('../') ? rawImg : (rawImg.startsWith('images/') ? '../' + rawImg : '../images/' + rawImg);
                        });
                    } else {
                        let rawImg = product.image || 'images/default.png';
                        imagesList = [rawImg.startsWith('../') ? rawImg : (rawImg.startsWith('images/') ? '../' + rawImg : '../images/' + rawImg)];
                    }

                    let mainImgSrc = imagesList[0];

                    let thumbnailsHTML = '';
                    imagesList.forEach((imgSrc, index) => {
                        let activeClass = index === 0 ? 'active' : '';
                        thumbnailsHTML += `<img src="${imgSrc}" alt="Thumb ${index + 1}" class="thumb ${activeClass}" onclick="changeImage(this)">`;
                    });

                    let tagsHTML = "";
                    if (product.tags && Array.isArray(product.tags)) {
                        product.tags.forEach(tag => {
                            tagsHTML += `<span class="tag">✓ ${tag}</span>`;
                        });
                    }

                    container.innerHTML = `
                        <!-- Left: Image Gallery -->
                        <div class="product-gallery-section">
                            <div class="main-preview-img">
                                <img id="productImage" src="${mainImgSrc}" alt="${product.name}">
                            </div>
                            <div class="thumbnail-row">
                                ${thumbnailsHTML}
                            </div>
                        </div>

                        <!-- Right: Product Info -->
                        <div class="product-info-section">
                            <div class="title-share-row">
                                <div>
                                    <span class="brand-badge">${product.brand ? product.brand.toUpperCase() : ''}</span>
                                    <h1 class="single-product-title" id="productTitle">${product.name}</h1>
                                    <p class="product-category-subtitle" id="productSubtitle">${product.subtitle || product.machine_type || ''}</p>
                                </div>
                            </div>

                            <div class="product-tags" id="productTags">
                                ${tagsHTML}
                            </div>

                            <h2 class="single-price" id="productPrice">${product.price || 'តម្លៃទំនាក់ទំនង'}</h2>

                            <div class="short-desc-box">
                                <div class="desc-box-title">
                                    <i class="fa-regular fa-file-lines"></i> Product Description
                                </div>
                                <p id="productDesc">${product.description || 'គ្មានការពន្យល់លម្អិត។'}</p>
                            </div>

                            <!-- ប៊ូតុង Telegram ដែលមាន ID សម្រាប់ភ្ជាប់ JavaScript -->
                            <a href="#" id="telegramChatBtn" target="_blank" class="btn-contact-us">
                                <i class="fa-brands fa-telegram"></i> Contact Us Telegram
                            </a>

                            <div class="delivery-stock-info">
                                <p class="delivery-text"><i class="fa-solid fa-truck-fast"></i> សេវាដឹកជញ្ជូនរហ័សទូទាំងប្រទេស </p>
                                <p class="stock-status"><i class="fa-solid fa-box"></i> In Stock</p>
                            </div>
                        </div>
                    `;
                    
                    specsSection.style.display = 'block';

                    const telegramUsername = "Mac_error404";
                    const message = `Hello, I am interested in this product: ${product.name} (ID: ${product.id})`;
                    const telegramUrl = `https://t.me/${telegramUsername}?text=${encodeURIComponent(message)}`;
                    
                    const telegramBtn = document.getElementById('telegramChatBtn');
                    if (telegramBtn) {
                        telegramBtn.href = telegramUrl;
                    }
                    
                    // 5. តារាង Specs លម្អិត
                    let specsTableHTML = '';
                    if (product.specs && Array.isArray(product.specs) && product.specs.length > 0) {
                        product.specs.forEach(specGroup => {
                            specsTableHTML += `
                                <tr class="section-header">
                                    <td colspan="2">${specGroup.category}</td>
                                </tr>
                            `;
                            if (specGroup.rows && Array.isArray(specGroup.rows)) {
                                specGroup.rows.forEach(row => {
                                    specsTableHTML += `
                                        <tr>
                                            <td class="spec-label">${row.label}</td>
                                            <td class="spec-value">${row.val}</td>
                                        </tr>
                                    `;
                                });
                            }
                        });
                        document.getElementById('specsContainerTable').innerHTML = specsTableHTML;
                    } else {
                        document.getElementById('specsContainerTable').innerHTML = '<tr><td colspan="2" style="padding: 15px; color: #666; text-align: center;">មិនមានទិន្ន័យបច្ចេកទេសលម្អិតបន្ថែមទេសម្រាប់ផលិតផលនេះ។</td></tr>';
                    }
                })
                .catch(error => {
                    console.error('Error:', error);
                    container.innerHTML = '<p style="text-align: center; color: red; grid-column: 1 / -1;">មានបញ្ហាក្នុងការទាញយកទិន្នន័យ!</p>';
                });
        });
    </script>

    <!-- Connect External JavaScript for Header/Footer Loading -->
    <script src="../header/include.js"></script>
</body>
</html>
