<!DOCTYPE html>
<html lang="km">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - DPrinteraro</title>

    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Leelawadee UI', 'Khmer OS Siemreap', 'Segoe UI', sans-serif;
        }

        body {
            background-color: #f5f6f8;
            color: #333;
            display: flex;
            min-height: 100vh;
        }

        /* Sidebar Styling */
        .admin-sidebar {
            width: 260px;
            background-color: #161617;
            color: #fff;
            display: flex;
            flex-direction: column;
            padding: 20px;
        }

        .sidebar-logo {
            font-size: 20px;
            font-weight: 700;
            color: #fff;
            margin-bottom: 30px;
            text-decoration: none;
        }

        .sidebar-logo span {
            color: #0071e3;
        }

        .sidebar-menu {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .sidebar-menu a {
            color: #a1a1a6;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 6px;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            transition: all 0.2s;
        }

        .sidebar-menu a:hover, .sidebar-menu a.active {
            background-color: #0071e3;
            color: #fff;
        }

        /* Main Content Area */
        .admin-main {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .admin-header {
            background-color: #fff;
            padding: 15px 30px;
            border-bottom: 1px solid #e5e5e5;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            font-size: 22px;
            font-weight: 600;
        }

        .admin-content {
            padding: 30px;
            overflow-y: auto;
        }

        /* Stats Cards & Actions */
        .top-action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            gap: 20px;
            flex-wrap: wrap;
        }

        .stat-card {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            border-left: 4px solid #0071e3;
            flex: 1;
            min-width: 220px;
        }

        .stat-card h3 {
            font-size: 14px;
            color: #666;
            margin-bottom: 8px;
        }

        .stat-card .number {
            font-size: 24px;
            font-weight: 700;
            color: #111;
        }

        .btn-download {
            background-color: #34c759;
            color: #fff;
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            transition: background 0.2s;
        }

        .btn-download:hover {
            background-color: #28a745;
        }

        /* Table & Forms Section */
        .card-box {
            background: #fff;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
            padding: 20px;
            margin-bottom: 30px;
        }

        .card-box h2 {
            font-size: 18px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 15px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .form-group.full-width {
            grid-column: 1 / -1;
        }

        .form-group label {
            font-size: 13px;
            font-weight: 600;
            color: #444;
        }

        .form-group input, .form-group select, .form-group textarea {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
        }

        .form-group textarea {
            resize: vertical;
            min-height: 120px;
        }

        .btn-primary {
            background-color: #0071e3;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background-color: #005bb5;
        }

        .btn-secondary {
            background-color: #8e8e93;
            color: #fff;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            margin-left: 10px;
            display: none;
        }

        .btn-secondary:hover {
            background-color: #636366;
        }

        /* Products Table */
        .admin-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        .admin-table th, .admin-table td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
            font-size: 14px;
        }

        .admin-table th {
            background-color: #fafafa;
            font-weight: 600;
            color: #444;
        }

        .admin-table img {
            width: 40px;
            height: 40px;
            object-fit: cover;
            border-radius: 4px;
        }

        .action-btns {
            display: flex;
            gap: 6px;
        }

        .btn-edit {
            background-color: #0071e3;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-edit:hover {
            background-color: #005bb5;
        }

        .btn-danger {
            background-color: #ff3b30;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
        }

        .btn-danger:hover {
            background-color: #d32f2f;
        }

        /* Toast Notification Style */
        #toastBox {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .toast {
            background-color: #161617;
            color: #fff;
            padding: 12px 20px;
            border-radius: 8px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 14px;
            border-left: 4px solid #34c759;
            animation: slideIn 0.3s ease, fadeOut 0.3s ease 2.7s forwards;
        }
        .toast i {
            color: #34c759;
            font-size: 18px;
        }
        @keyframes slideIn {
            from { transform: translateX(100%); opacity: 0; }
            to { transform: translateX(0); opacity: 1; }
        }
        @keyframes fadeOut {
            from { opacity: 1; }
            to { opacity: 0; visibility: hidden; }
        }

        @media (max-width: 768px) {
            body {
                flex-direction: column;
            }
            .admin-sidebar {
                width: 100%;
                padding: 15px;
            }
            .sidebar-menu {
                flex-direction: row;
                overflow-x: auto;
            }
        }
    </style>
</head>
<body>

    <!-- Sidebar -->
    <div class="admin-sidebar">
        <a href="#" class="sidebar-logo"><span>dARO</span>printer Admin</a>
        <ul class="sidebar-menu">
            <li><a href="#" class="active"><i class="fa-solid fa-chart-pie"></i> ផ្ទាំងដើម (Dashboard)</a></li>
            <li><a href="../index.html" target="_blank"><i class="fa-solid fa-globe"></i> មើលវិបសាយ (Live Site)</a></li>
        </ul>
    </div>

    <!-- Main Content -->
    <div class="admin-main">
        <div class="admin-header">
            <h1>គ្រប់គ្រងទំនិញ និងផលិតផល</h1>
            <span><i class="fa-solid fa-user-shield"></i> Admin Daro</span>
        </div>

        <div class="admin-content">
            <!-- Stats and Download JSON Button Bar -->
            <div class="top-action-bar">
                <div class="stat-card">
                    <h3>ផលិតផលសរុបក្នុងប្រព័ន្ធ</h3>
                    <div class="number" id="totalProductsCount">0</div>
                </div>
                <button class="btn-download" onclick="downloadJsonFile()">
                    <i class="fa-solid fa-download"></i> ទាញយកឯកសារ products.json
                </button>
            </div>

            <!-- Form បន្ថែម/កែសម្រួលទំនិញ -->
            <div class="card-box">
                <h2 id="formTitle"><i class="fa-solid fa-plus-circle"></i> បន្ថែមទំនិញថ្មី</h2>
                <form id="addProductForm">
                    <input type="hidden" id="editIndex" value="-1">
                    <div class="form-grid">
                        <div class="form-group">
                            <label>ឈ្មោះទំនិញ (Name)</label>
                            <input type="text" id="prodName" required placeholder="ឧ. Canon imageRUNNER 2425">
                        </div>
                        <div class="form-group">
                            <label>ប្រេន (Brand)</label>
                            <input type="text" id="prodBrand" required placeholder="ឧ. canon, epson...">
                        </div>
                        <div class="form-group">
                            <label>ប្រភេទ (Category)</label>
                            <select id="prodCategory">
                                <option value="Laser Printer">Laser Printer</option>
                                <option value="Ink Printer">Ink Printer</option>
                                <option value="Canon Firmware">Canon Firmware</option>
                                <option value="Epson Firmware">Epson Firmware</option>
                                <option value="Windows">Windows</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label>តម្លៃ (Price)</label>
                            <input type="text" id="prodPrice" placeholder="ឧ. $150 ឬ តម្លៃទំនាក់ទំនង">
                        </div>
                        <div class="form-group full-width">
                            <label>តំណភ្ជាប់រូបភាព (Image URL / Path)</label>
                            <input type="text" id="prodImage" placeholder="ឧ. images/canon-ir2425.jpg">
                        </div>
                        <!-- ប្រអប់ Description រួមបញ្ចូលគ្នា (Short & Full Description ក្នុងប្រអប់តែមួយ) -->
                        <div class="form-group full-width">
                            <label>បរិយាយព័ត៌មានទំនិញ (Description)</label>
                            <textarea id="prodDescription" placeholder="សរសេរព័ត៌មានលម្អិត ឬសេចក្តីសង្ខេបរបស់ទំនិញនៅទីនេះ..."></textarea>
                        </div>
                    </div>
                    <div>
                        <button type="submit" class="btn-primary" id="saveButton"><i class="fa-solid fa-save"></i> រក្សាទុកទំនិញ</button>
                        <button type="button" class="btn-secondary" id="cancelBtn" onclick="resetForm()"><i class="fa-solid fa-xmark"></i> បោះបង់</button>
                    </div>
                </form>
            </div>

            <!-- តារាងបង្ហាញបញ្ជីទំនិញ -->
            <div class="card-box">
                <h2>បញ្ជីទំនិញបច្ចុប្បន្ន</h2>
                <div style="overflow-x: auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>រូបភាព</th>
                                <th>ឈ្មោះទំនិញ</th>
                                <th>ប្រេន</th>
                                <th>ប្រភេទ</th>
                                <th>តម្លៃ</th>
                                <th>សកម្មភាព</th>
                            </tr>
                        </thead>
                        <tbody id="adminProductTableBody">
                            <tr>
                                <td colspan="6" style="text-align: center; color: #666;">កំពុងផ្ទុកទិន្នន័យ...</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toastBox"></div>

    <!-- JavaScript សម្រាប់គ្រប់គ្រងទិន្នន័យ -->
    <script>
        let productsData = [];

        // ទាញយកទិន្នន័យពី products.json ឬ LocalStorage
        document.addEventListener("DOMContentLoaded", async () => {
            const localSaved = localStorage.getItem('daro_products');
            if (localSaved) {
                productsData = JSON.parse(localSaved);
                renderAdminTable(productsData);
            } else {
                try {
                    const response = await fetch('../products.json');
                    if (!response.ok) throw new Error('Failed to load JSON');
                    productsData = await response.json();
                    localStorage.setItem('daro_products', JSON.stringify(productsData));
                    renderAdminTable(productsData);
                } catch (err) {
                    console.error(err);
                    document.getElementById('adminProductTableBody').innerHTML = `<tr><td colspan="6" style="text-align: center; color: red;">មិនអាចទាញយកទិន្នន័យ products.json បានទេ។</td></tr>`;
                }
            }
        });

        function renderAdminTable(list) {
            const tbody = document.getElementById('adminProductTableBody');
            document.getElementById('totalProductsCount').innerText = list.length;

            if (list.length === 0) {
                tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: #666;">មិនមានទំនិញក្នុងប្រព័ន្ធទេ</td></tr>`;
                return;
            }

            tbody.innerHTML = list.map((item, index) => {
                let img = item.image || (item.images && item.images[0]) || '../images/default.png';
                if (!img.startsWith('../') && !img.startsWith('http')) {
                    img = '../' + img;
                }
                let descText = item.description || item.subtitle || '';
                return `
                    <tr>
                        <td><img src="${img}" alt="img"></td>
                        <td><strong>${item.name}</strong><br><small style="color:#666;">${descText.substring(0, 40)}...</small></td>
                        <td>${item.brand || ''}</td>
                        <td>${item.category || ''}</td>
                        <td>${item.price || 'ទំនាក់ទំនង'}</td>
                        <td>
                            <div class="action-btns">
                                <button class="btn-edit" onclick="editProduct(${index})"><i class="fa-solid fa-pen-to-square"></i> កែ</button>
                                <button class="btn-danger" onclick="deleteProduct(${index})"><i class="fa-solid fa-trash"></i> លុប</button>
                            </div>
                        </td>
                    </tr>
                `;
            }).join('');
        }

        // មុខងារបង្ហាញ Toast Notification
        function showToast(message) {
            const toastBox = document.getElementById('toastBox');
            const toast = document.createElement('div');
            toast.className = 'toast';
            toast.innerHTML = `<i class="fa-solid fa-circle-check"></i> <span>${message}</span>`;
            toastBox.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 3000);
        }

        // មុខងារ Add ឬ Update ទំនិញ
        document.getElementById('addProductForm').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const editIndex = parseInt(document.getElementById('editIndex').value);
            const fullDesc = document.getElementById('prodDescription').value || '';
            
            const productDataObj = {
                id: editIndex > -1 ? productsData[editIndex].id : ('prod-' + Date.now()),
                name: document.getElementById('prodName').value,
                brand: document.getElementById('prodBrand').value,
                category: document.getElementById('prodCategory').value,
                price: document.getElementById('prodPrice').value || 'តម្លៃទំនាក់ទំនង',
                image: document.getElementById('prodImage').value || 'images/default.png',
                subtitle: fullDesc, // ដាក់បញ្ចូលគ្នាជា subtitle ផង
                description: fullDesc // ដាក់បញ្ចូលគ្នាជា description ផង
            };

            if (editIndex > -1) {
                productsData[editIndex] = productDataObj;
                showToast('បានកែប្រែផលិតផលដោយជោគជ័យ!');
            } else {
                productsData.unshift(productDataObj);
                showToast('បានបន្ថែមផលិតផលថ្មីដោយជោគជ័យ!');
            }

            localStorage.setItem('daro_products', JSON.stringify(productsData));
            renderAdminTable(productsData);
            resetForm();
        });

        // មុខងារទាញទិន្នន័យមកដាក់ក្នុង Form ដើម្បីកែប្រែ
        function editProduct(index) {
            const item = productsData[index];
            document.getElementById('editIndex').value = index;
            document.getElementById('prodName').value = item.name || '';
            document.getElementById('prodBrand').value = item.brand || '';
            document.getElementById('prodCategory').value = item.category || 'Laser Printer';
            document.getElementById('prodPrice').value = item.price || '';
            document.getElementById('prodImage').value = item.image || '';
            document.getElementById('prodDescription').value = item.description || item.subtitle || '';

            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-pen-to-square"></i> កែសម្រួលទំនិញ: ${item.name}`;
            document.getElementById('saveButton').innerHTML = `<i class="fa-solid fa-save"></i> ធ្វើបច្ចុប្បន្នភាព (Update)`;
            document.getElementById('cancelBtn').style.display = 'inline-block';

            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // មុខងារ Reset Form វិញ
        function resetForm() {
            document.getElementById('addProductForm').reset();
            document.getElementById('editIndex').value = -1;
            document.getElementById('formTitle').innerHTML = `<i class="fa-solid fa-plus-circle"></i> បន្ថែមទំនិញថ្មី`;
            document.getElementById('saveButton').innerHTML = `<i class="fa-solid fa-save"></i> រក្សាទុកទំនិញ`;
            document.getElementById('cancelBtn').style.display = 'none';
        }

        // មុខងារលុបទំនិញ
        function deleteProduct(index) {
            if (confirm('តើបងពិតជាចង់លុបទំនិញនេះមែនទេ?')) {
                productsData.splice(index, 1);
                localStorage.setItem('daro_products', JSON.stringify(productsData));
                renderAdminTable(productsData);
                showToast('បានលុបផលិតផលជោគជ័យ!');
            }
        }

        // មុខងារទាញយកឯកសារ products.json មកប្រើប្រាស់លើ GitHub
        function downloadJsonFile() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(productsData, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", "products.json");
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
            showToast('បានទាញយកឯកសារ products.json ដោយជោគជ័យ!');
        }
    </script>
</body>
</html>
